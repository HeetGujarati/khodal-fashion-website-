  <circle cx="50" cy="50" r="4" fill="url(#gold)" />
  <!-- Hour Markers -->
  <circle cx="50" cy="18" r="2" fill="url(#gold)" />
  <circle cx="82" cy="50" r="2" fill="url(#gold)" />
